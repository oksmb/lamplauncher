name: Build

# Every push builds and tests the app. On the default branch, a build that passes
# is published as a GitHub Release with LampLauncher.apk attached, so
# https://github.com/<owner>/<repo>/releases/latest/download/LampLauncher.apk
# always gets the newest one. (Running the workflow by hand on the default branch
# releases too.)
#
# Releases are signed with a private key kept in two repository secrets
# (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_BASE64  the PKCS12 keystore, base64-encoded (key alias "lamplauncher")
#   SIGNING_PASSWORD         its password
# Without them the APK is signed with a throwaway debug key and isn't released.
on:
  push:
    branches: ["**"] # (not tags: releases create those)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web app tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (core logic)
        run: npm test
      - name: Browser for the end-to-end test
        timeout-minutes: 12
        # Use the runner's own Google Chrome: no downloads, and no system packages
        # (installing Playwright's font packages from the Ubuntu mirror can stall).
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
            exit 0
          fi
          for i in 1 2 3; do
            timeout 300 npx playwright install chromium && exit 0
            echo "download attempt $i failed, retrying"
            sleep 10
          done
          exit 1
      - name: End-to-end test (TV page + cam manager, fake YouTube)
        run: npm run test:ui -- ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: ignore

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.check.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No release signing key (repository secrets SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD): this APK is signed with a throwaway debug key and won't be released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d -i > "$RUNNER_TEMP/release.p12" # (-i: ignores stray spaces from pasting)
          echo "LAMPLAUNCHER_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: android
        env:
          LAMPLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease -PbuildNumber=${{ github.run_number }}
      - name: Check the APK
        id: check
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "== $apk ($(du -h "$apk" | cut -f1))"
          for f in assets/index.html assets/admin.html assets/js/main.js assets/js/core/controller.js \
                   assets/js/ui/globe.js assets/img/earth-day.jpg assets/img/earth-night.jpg \
                   assets/js/site-helper.js assets/css/style.css classes.dex; do
            unzip -l "$apk" "$f" > /dev/null || { echo "missing $f"; exit 1; }
            echo "has $f"
          done
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|leanback|launchable)"
          "$tools/apksigner" verify --print-certs "$apk" | head -3
          version=$("$tools/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LampLauncher-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Release
    needs: [web, android]
    # the default branch only (not pull requests or other branches), and only
    # builds signed with the release key
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.android.outputs.signed == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and earlier release tags, for the notes
      - uses: actions/download-artifact@v4
        with:
          name: LampLauncher-apk
          path: apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
          TAG: build-${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # a newer push builds its own release; don't let an older one overtake it
          git fetch -q origin "$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$GITHUB_SHA" ]; then
            echo "the branch has moved on since this build; skipping the release"
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists (a re-run); nothing to do"
            exit 0
          fi
          cp apk/*.apk LampLauncher.apk
          prev=$(git tag --list 'build-*' --sort=-version:refname | head -1)
          {
            echo "Download **LampLauncher.apk** below and install it on your Android TV / Google TV box."
            echo "It installs over an earlier LampLauncher and keeps your cams and settings."
            echo
            echo "## What's new"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..HEAD"
            else
              git log -1 --format='- %s'
            fi
            echo
            echo "Version $VERSION, built from $GITHUB_SHA."
          } > notes.md
          cat notes.md
          gh release create "$TAG" LampLauncher.apk \
            --target "$GITHUB_SHA" --title "LampLauncher $VERSION" --notes-file notes.md --latest
